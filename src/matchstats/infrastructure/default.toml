# Standard-Parameter. Eigene Datei per `matchstats run ... --config meine.toml` angeben.

# Erkennung nur auf jedem N-ten Bild; das Tracking überbrückt die Lücken.
detect_every = 5

# Testbilder pro Clip (gleichmäßig verteilt), für `matchstats sample-frames`.
frames_per_clip = 20

# Erkennung (T3): Modellgröße (nano, small, medium) und Mindest-Score einer Erkennung.
detector_model = "small"
score_threshold = 0.3

# Kachel-Variante: Kantenlänge in Pixeln, Überlappungsanteil, IoU-Schwelle fürs Zusammenführen.
tile_size = 640
tile_overlap = 0.2
nms_iou = 0.5

# Tracking (T4): Erkennungen unter detect_min_score werden verworfen, ab track_high_score
# darf eine Erkennung eine Spur eröffnen; track_match_iou ist die Mindest-Überlappung der Zuordnung.
detect_min_score = 0.1
track_high_score = 0.4
track_match_iou = 0.3
# Wie lange eine Spur ohne Erkennung überbrückt wird, bevor sie endet.
track_max_lost_seconds = 1.5
# Treffer, bis eine Spur bestätigt wird (vorher nicht in der Ausgabe).
track_min_hits = 3
# Abstand zum Bildrand, innerhalb dessen eine verlorene Spur sofort endet.
track_edge_margin_px = 40

# Kandidaten für ID-Wechsel (T4): neue Spur beginnt höchstens so viele Sekunden nach dem Ende
# einer alten und höchstens so viele Boxhöhen von deren letzter Position entfernt.
switch_max_gap_seconds = 1.0
switch_max_distance_heights = 1.0

# Kamerabewegung (T4b). Startwerte sind geraten und noch nicht an echten Videos gemessen.
# Ausgleich an/aus kommt aus dem Aufnahme-Profil (siehe [camera_motion_presets]). Das Preset
# schlägt eine eigene Datei (--config); überschreiben lässt es sich nur über `settings` im
# clip.json oder per Aufruf (matchstats track --camera / --no-camera).
# Verkleinerungsfaktor des Bildes für die Schätzung (1.0 = volle Größe).
camera_downscale = 0.5
# Schätzungen mit weniger Qualität (Anteil passender Punkte, 0 bis 1) gelten als unbekannt.
camera_min_quality = 0.5
# Höchste Zahl verfolgter Merkmalspunkte je Bild.
camera_max_features = 300

# Teamzuordnung (T5a). Startwerte sind geraten und noch nicht an echten Videos gemessen.
# Anteil der Boxhöhe von oben, der als Oberkörper (Trikot) ausgewertet wird.
team_upper_body_fraction = 0.5
# Kleinere Boxen werden nicht zugeordnet (Ergebnis "unbekannt").
team_min_box_height_px = 24
team_min_box_width_px = 8
# Rasen-Farbmaske: Farbton von/bis (0 bis 179 wie OpenCV) und Mindest-Sättigung (0 bis 255).
team_grass_hue_range = [35, 85]
team_grass_min_saturation = 40
# Zahl der Farbgruppen (Team A, Team B, Schiedsrichter, Torwart).
team_cluster_count = 4
# Weitere Gruppen (jenseits der zwei größten) mit größerem Anteil der Boxen werden dem Team mit dem
# nächsten Gruppenmittelpunkt zugeschlagen; nur Gruppen bis zu diesem Anteil sind Ausreißer
# (Schiedsrichter/Torwart).
team_outlier_max_share = 0.15
# Mindest-Farbabstand (RGB, 0 bis 1 je Kanal) für eine neue Farbgruppe; geraten, an echten Daten messen.
team_min_cluster_distance = 0.2
# Mindestzahl Nicht-Rasen-Pixel im Oberkörper, sonst "unbekannt".
team_min_pixels = 30

# Aufnahme-Profil "camera_motion" eines Clips -> Parameter. Nur Daten, keine Logik:
# neue Profilwerte kommen durch einen weiteren Eintrag dazu. "unbekannt" gilt ohne Profilwert.
[camera_motion_presets.fest]
camera_compensation = false

[camera_motion_presets.schwenkt]
camera_compensation = true

[camera_motion_presets.schwenkt_und_zoomt]
camera_compensation = true

[camera_motion_presets.unbekannt]
camera_compensation = true
