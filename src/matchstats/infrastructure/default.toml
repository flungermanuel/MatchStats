# Standard-Parameter. Eigene Datei per `matchstats run ... --config meine.toml` angeben.

# Erkennung nur auf jedem N-ten Bild; das Tracking überbrückt die Lücken.
detect_every = 5

# Testbilder pro Clip (gleichmäßig verteilt), für `matchstats sample-frames`.
frames_per_clip = 20

# Erkennung (T3): Modellgröße (nano, small, medium) und Mindest-Score einer Erkennung.
detector_model = "small"
score_threshold = 0.3

# Kachel-Variante: Kantenlänge in Pixeln, Überlappungsanteil, IoU-Schwelle fürs Zusammenführen.
tile_size = 640
tile_overlap = 0.2
nms_iou = 0.5

# Tracking (T4): Erkennungen unter detect_min_score werden verworfen, ab track_high_score
# darf eine Erkennung eine Spur eröffnen; track_match_iou ist die Mindest-Überlappung der Zuordnung.
detect_min_score = 0.1
track_high_score = 0.4
track_match_iou = 0.3
# Wie lange eine Spur ohne Erkennung überbrückt wird, bevor sie endet.
track_max_lost_seconds = 1.5
# Treffer, bis eine Spur bestätigt wird (vorher nicht in der Ausgabe).
track_min_hits = 3
# Abstand zum Bildrand, innerhalb dessen eine verlorene Spur sofort endet.
track_edge_margin_px = 40
